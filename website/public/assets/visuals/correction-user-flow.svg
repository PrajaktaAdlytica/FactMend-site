erif" font-size="15">Confirm</text><text x="618" y="274" fill="#59634B" font-family="Inter, sans-serif" font-size="15">correction</text><path d="M762 255 L782 255" fill="none" stroke="#59634B" stroke-width="2" marker-end="url(#arrow)" /><rect x="784" y="190" width="164" height="145" rx="12" fill="#DDE3D2" stroke="#D7D2C5"/><text x="804" y="220" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">05</text><text x="804" y="255" fill="#59634B" font-family="Inter, sans-serif" font-size="15">Review current</text><text x="804" y="274" fill="#59634B" font-family="Inter, sans-serif" font-size="15">value</text><text x="40" y="430" fill="#1F2617" font-family="Inter, sans-serif" font-size="20">Keyboard and touch follow the same order; each step can be reviewed.</text></svg>