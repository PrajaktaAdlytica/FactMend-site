<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factmend responsive QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:16px;display:flex;justify-content:center;gap:24px}iframe{display:block;width:390px;height:640px;border:0;margin:auto;background:white}label{display:flex;gap:8px;align-items:center}</style></head><body><header><label>Page<select id="route"><option value="/">Homepage</option><option value="/products/memory-desk">Memory Desk</option><option value="/products/memory-signal">Memory Signal</option><option value="/platform">Platform</option><option value="/pricing">Pricing</option><option value="/resources">Resources</option><option value="/assessment">Assessment</option><option value="/demo">Workspace</option></select></label><label>Width<select id="size"><option>390</option><option>360</option><option>768</option></select></label></header><iframe title="Responsive website" src="/"></iframe><script>document.querySelector('#route').onchange=e=>document.querySelector('iframe').src=e.target.value;document.querySelector('#size').onchange=e=>document.querySelector('iframe').style.width=e.target.value+'px';</script></body></html>
