<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">provenance chain</title><desc id="d">Factmend concept illustration. Synthetic data, not a working product.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59634B"/></marker></defs><text x="40" y="40" fill="#59634B" font-family="Inter, sans-serif" font-size="13">DEMO — SYNTHETIC DATA</text><text x="40" y="95" fill="#1F2617" font-family="Instrument Serif, serif" font-size="44">Source → fact → current version</text><rect x="40" y="190" width="260" height="150" rx="12" fill="#F7C9A3" stroke="#D7D2C5"/><text x="60" y="220" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">Source excerpt</text><text x="60" y="255" fill="#59634B" font-family="Inter, sans-serif" font-size="15">Synthetic support chat</text><rect x="365" y="190" width="260" height="150" rx="12" fill="#F7F4EC" stroke="#D7D2C5"/><text x="385" y="220" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">Extracted fact</text><text x="385" y="255" fill="#59634B" font-family="Inter, sans-serif" font-size="15">Preference · C-012</text><rect x="690" y="190" width="270" height="150" rx="12" fill="#DDE3D2" stroke="#D7D2C5"/><text x="710" y="220" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">Current version</text><text x="710" y="255" fill="#59634B" font-family="Inter, sans-serif" font-size="15">portal only</text><path d="M300 265 L365 265" fill="none" stroke="#59634B" stroke-width="2" marker-end="url(#arrow)" /><path d="M625 265 L690 265" fill="none" stroke="#59634B" stroke-width="2" marker-end="url(#arrow)" /><text x="40" y="440" fill="#1F2617" font-family="Inter, sans-serif" font-size="20">Every connection needs a source ID, timestamp and scope label.</text></svg>