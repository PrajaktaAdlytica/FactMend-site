<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">proof retention timeline</title><desc id="d">Factmend concept illustration. Synthetic data, not a working product.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59634B"/></marker></defs><text x="40" y="40" fill="#59634B" font-family="Inter, sans-serif" font-size="13">DEMO — SYNTHETIC DATA</text><text x="40" y="95" fill="#1F2617" font-family="Instrument Serif, serif" font-size="44">Policy changes travel with the fact.</text><path d="M95 260 L910 260" fill="none" stroke="#59634B" stroke-width="2" marker-end="url(#arrow)" /><circle cx="90" cy="260" r="10" fill="#F49A23"/><text x="55" y="210" fill="#1F2617" font-family="Inter, sans-serif" font-size="23">Capture</text><text x="55" y="310" fill="#1F2617" font-family="Inter, sans-serif" font-size="17">Consent: support</text><circle cx="350" cy="260" r="10" fill="#F49A23"/><text x="315" y="210" fill="#1F2617" font-family="Inter, sans-serif" font-size="23">Policy</text><text x="315" y="310" fill="#1F2617" font-family="Inter, sans-serif" font-size="17">Retention: 30 days</text><circle cx="610" cy="260" r="10" fill="#F49A23"/><text x="575" y="210" fill="#1F2617" font-family="Inter, sans-serif" font-size="23">Update</text><text x="575" y="310" fill="#1F2617" font-family="Inter, sans-serif" font-size="17">Purpose restricted</text><circle cx="870" cy="260" r="10" fill="#F49A23"/><text x="835" y="210" fill="#1F2617" font-family="Inter, sans-serif" font-size="23">Expiry</text><text x="835" y="310" fill="#1F2617" font-family="Inter, sans-serif" font-size="17">Queue for review</text><rect x="40" y="405" width="910" height="95" rx="12" fill="#FFFFFF" stroke="#D7D2C5"/><text x="60" y="435" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">Illustrative policy timeline</text><text x="60" y="470" fill="#59634B" font-family="Inter, sans-serif" font-size="15">30 days is a synthetic fixture, not a recommended retention period.</text></svg>