<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">contact map</title><desc id="d">Factmend concept illustration. Synthetic data, not a working product.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59634B"/></marker></defs><text x="40" y="40" fill="#59634B" font-family="Inter, sans-serif" font-size="13">DEMO — SYNTHETIC DATA</text><text x="40" y="95" fill="#1F2617" font-family="Instrument Serif, serif" font-size="44">Contact starts with a map.</text><rect x="40" y="180" width="320" height="200" rx="12" fill="#DDE3D2" stroke="#D7D2C5"/><text x="60" y="210" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">Your assistant</text><text x="60" y="245" fill="#59634B" font-family="Inter, sans-serif" font-size="15">Tenant / purpose / stores</text><rect x="500" y="180" width="450" height="200" rx="12" fill="#F7C9A3" stroke="#D7D2C5"/><text x="520" y="210" fill="#1F2617" font-family="Inter, sans-serif" font-size="22">Memory deletion paths</text><text x="520" y="245" fill="#59634B" font-family="Inter, sans-serif" font-size="15">Index → cache → backup</text><path d="M360 280 L500 280" fill="none" stroke="#59634B" stroke-width="2" marker-end="url(#arrow)" /><text x="40" y="475" fill="#1F2617" font-family="Inter, sans-serif" font-size="20">Collect minimum business context; never ask for real customer memory.</text></svg>